<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            line-height: 1.8;
        }
        nav {
            background-color:#333 ;
            padding: 1rem 2rem;
            width: 100%;
            box-sizing: border-box;
        }
        nav a{
            color: white;
            text-decoration: none;
            font-size: 1rem;
            font-weight:bold ;

        }
        container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }
       div.message {
            padding: 10px;  
            margin: 10px 0;
            border-radius: 4px;
            text-align: center;
        }
        div.success{
            background-color: #c6eecf;
            color:#155724 ;
            border: 1px solid #9ff6e7;  
        }
        .error {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        .info {
            background-color:#b6e7f0; ;
            color: #0c5460;
            border: 1px solid #bee5be;

        }
    </style>
</head>
<body>
    <nav>
        <div class="container">
            <a href="{% url 'home' %}">Weather App</a>
        </div>
    </nav>
    <div class="container">
            {% if messages %}
                {% for message in messages %}
                <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}  

            {% endblock %}
    </div>
</body>
</html>
